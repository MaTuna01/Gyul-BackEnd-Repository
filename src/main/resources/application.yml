spring:
  application:
    name: Gyul-BackEnd-Repository

  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/gyul_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 소유. Hibernate는 엔티티↔스키마 일치만 검증
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    # 기존 데이터가 있는 DB(개발/운영 구DB)는 최초 1회 baseline 처리 후 이후 마이그레이션 적용
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: localhost
      port: 6379
      database: 1  # DB 1 = Refresh Token(RT:{email}). DB 0은 FastAPI 대화 세션 (docs/integration-spec.md §4)

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: gyul-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: account_email, profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  cors:
    # 콤마로 여러 오리진 지정 가능. 프로덕션은 실제 프론트 도메인을 CORS_ALLOWED_ORIGINS로 주입.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:3000}  # 프론트 개발 완료 후 실제 주소로 교체
  kafka:
    topic:
      analysis-report: interview.analysis-report          # FastAPI → Spring 분석 리포트 토픽 (docs/integration-spec.md §3)
      analysis-report-dlq: interview.analysis-report.dlq  # 파싱 실패/재시도 소진 메시지 DLQ (§3.3)

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000    # 30분 (ms)
  refresh-expiration: 604800000 # 7일 (ms) — Redis RT TTL과 동일
